<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyWatchers</title>
    <link rel="stylesheet" href="weather.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrapper">
      <h1>SkyWatchers</h1>

      <div class="tab-container">
        <p class="tab" data-userWeather>Your Weather</p>
        <p class="tab" data-searchWeather>Search Weather</p>
      </div>

      <div class="weather-container">
        <!-- grant location container -->
        <div class="sub-container grant-location-container">
          <img
            src="./assets/logo-location.png"
            alt=""
            loading="lazy"
            width="80"
            height="80"
          />
          <p>Grant Location Access</p>
          <p>Allow Access to Get Weather Information</p>
          <button class="btn" data-grantAccess>Grant Access</button>
        </div>
        <!-- search Form -->
        <form action="" class="form-container" data-searchForm>
          <input type="text" placeholder="Search Location.." data-searchInput />
          <button class="btn">
            <img src="./assets/icon-search.svg" loading="lazy" />
          </button>
        </form>

        <!-- Loading Screen Container -->
        <div class="sub-container loading-container">
          <img src="./assets/Loading.gif" alt="" width="160" height="160 " />
          <p>Loading</p>
        </div>

        <!-- Show Weather Info-->
        <div class="sub-container user-info-container">
          <!-- city name and Flag -->
          <div class="name">
            <p data-cityName></p>
            <img src="" alt="" data-countryIcon />
          </div>
          <!-- weather Description -->
          <p data-weatherDesc></p>
          <!-- weather Icon -->
          <img src="" alt="" data-weatherIcon />
          <!-- temperature -->
          <p data-temp></p>

          <!-- 3-cards parameters -->
          <div class="parameter-container">
            <!-- card-1 -->
            <div class="parameter">
              <img src="./assets/illu-wind.svg" alt="" />
              <p class="tag">Wind Speed</p>
              <p data-windspeed></p>
            </div>
            <!-- card-2 -->
            <div class="parameter">
              <img src="./assets/illu-humidity.svg" alt="" />
              <p class="tag">Humidity</p>
              <p data-humidity></p>
            </div>

            <!-- card-3 -->
            <div class="parameter">
              <img src="./assets/illu-cloud.svg" alt="" class="cloudiness" />
              <p class="tag">Clouds</p>
              <p data-cloudiness></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="weather.js"></script>
  </body>
</html>
